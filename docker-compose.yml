services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL Database with PostGIS Extension (GIS Cadastre & Ledger)
  # -------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: zhms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecureZimbuild2026!}
      POSTGRES_DB: ${POSTGRES_DB:-zhms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - zhms-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhms} -d ${POSTGRES_DB:-zhms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  # -------------------------------------------------------------------------
  # 2. Redis 7 High-Throughput Job Queue (BullMQ / Async Background Jobs)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zhms-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - zhms-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # -------------------------------------------------------------------------
  # 3. ZHMS Core API Service (Node.js 20+ Express Engine)
  # -------------------------------------------------------------------------
  zhms-api:
    build:
      context: ./zhms-api
      dockerfile: Dockerfile
    container_name: zhms-core-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-zhms}:${POSTGRES_PASSWORD:-ChangeMeSecureZimbuild2026!}@postgres:5432/${POSTGRES_DB:-zhms}
      JWT_SECRET: ${JWT_SECRET:-a_very_strong_and_secure_jwt_secret_min_32_characters_for_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zhms.zimbuild.co.zw,https://portal.zimbuild.co.zw}
      TRUST_PROXY: "true"
      ENABLE_PAYMENT_SIMULATOR: "false"
      WEBHOOK_SECRET_ECOCASH: ${WEBHOOK_SECRET_ECOCASH:-ecocash_prod_hmac_secret_key_32_chars_long}
      WEBHOOK_SECRET_BANK_TRANSFER: ${WEBHOOK_SECRET_BANK_TRANSFER:-bank_transfer_prod_secret_32_chars_long}
      WEBHOOK_SECRET_OMARI: ${WEBHOOK_SECRET_OMARI:-omari_prod_secret_token_32_chars_long}
      WEBHOOK_SECRET_DEBIT_ORDER: ${WEBHOOK_SECRET_DEBIT_ORDER:-debit_order_prod_secret_32_chars_long}
      JOB_INTERVAL_MINUTES: 15
      LOG_MESSAGE_BODIES: "false"
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - zhms-internal
      - zhms-public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # -------------------------------------------------------------------------
  # 3. Zimbuild Enterprise ERP & Security Engine (Python 3.11 Backend)
  # -------------------------------------------------------------------------
  zhms-erp-python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: zhms-erp-python
    restart: always
    environment:
      PORT: 8000
      NODE_ENV: production
      SECURITY_AUDIT_LOG: /var/log/zhms/security_audit.jsonl
    volumes:
      - zhms-logs:/var/log/zhms
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - zhms-internal
      - zhms-public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # -------------------------------------------------------------------------
  # 4. Production Edge Reverse Proxy & TLS Gateway (Nginx Hardened)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine-slim
    container_name: zhms-edge-proxy
    restart: always
    depends_on:
      - zhms-api
      - zhms-erp-python
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - zhms-public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  zhms-internal:
    driver: bridge
    internal: true
  zhms-public:
    driver: bridge

volumes:
  pgdata:
  zhms-logs:
