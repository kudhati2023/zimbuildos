user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance tuning for high-concurrency public traffic
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Anti-DDoS Rate Limiting Zones (sliding-window IP tracking)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook_inbound:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # SSL hardening (TLS 1.2 and TLS 1.3 only, high security ciphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Primary HTTPS Server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed fallback or production Let's Encrypt certificates
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Defense-in-Depth Security Headers (OWASP Top 10 hardening)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 http://localhost:8000 http://127.0.0.1:8000 https://*; object-src 'none'; frame-ancestors 'none';" always;

        limit_conn conn_per_ip 50;
        client_max_body_size 20M;

        # Resolve containers through Docker's DNS at request time (10 s cache). A proxy_pass to a fixed
        # hostname is resolved once at start-up, so a restarted API container (new IP) gave 502 until nginx
        # itself was restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zhms_api zhms-api;

        # NOTE: no add_header inside location blocks. In nginx an add_header in a location discards every
        # add_header inherited from the server block, which silently removed all security headers above.
        # Caching uses `expires`, which does not have that effect.

        # Static Client Application (React / Vite PWA). The app shell is never cached, so a release is picked
        # up immediately; fingerprinted build assets are immutable and cached for a year.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires -1;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            access_log off;
        }

        # API liveness for the client's server indicator (otherwise /healthz falls through to the app shell
        # and always looks "online").
        location = /healthz {
            proxy_pass http://$zhms_api:5000;
        }

        # Core Node.js API Service (Allocations, GIS, Payments, Statements)
        location /api/v1/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://$zhms_api:5000;   # no URI part: the original /api/v1/... path is passed unchanged
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Stricter Rate Limiting on Public Registrations
        location /api/v1/public/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://$zhms_api:5000;   # no URI part: the original /api/v1/public/... path is passed unchanged
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Inbound Payment Webhooks (EcoCash, Bank Transfer, O'mari)
        location /api/v1/webhooks/ {
            limit_req zone=webhook_inbound burst=30 nodelay;
            proxy_pass http://$zhms_api:5000;   # no URI part: the original /api/v1/webhooks/... path is passed unchanged
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The Python prototype ERP (zhms-erp-python) is NOT published: it takes the caller's role from an
        # unverified X-User-Role header, so anyone could act as the CEO. It stays reachable only on the host
        # (127.0.0.1:8000) until it is retired or placed behind the ZHMS JWT (docs/RISKS_AND_QUESTIONS.md R1).
        location /api/erp/ {
            return 404;
        }
    }
}
