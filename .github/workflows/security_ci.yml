name: ISO 27001 Security Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security-audit-and-quality-gate:
    name: ISO 27001 DevSecOps Compliance Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node Unit Tests
        run: |
          npm --prefix zhms-api test:unit

      - name: Run DevSecOps Quality Gate & Secret Scan
        env:
          NODE_ENV: test
          ZIMBUILD_HMAC_SECRET: test_ci_ephemeral_security_secret_exceeding_32_chars!
        run: |
          python tools/security_gate.py

      - name: Run Full Python Test Suite
        env:
          NODE_ENV: test
          ZIMBUILD_HMAC_SECRET: test_ci_ephemeral_security_secret_exceeding_32_chars!
        run: |
          python -m pytest tests -v
